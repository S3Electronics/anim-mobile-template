 g.fillStyle=sk;g.beginPath();g.arc(243,1340+b,20,0,7);g.arc(417,1340+b,20,0,7);g.fill();F(sk,312,1045,36,30);
 g.beginPath();g.arc(272,995,14,0,7);g.arc(388,995,14,0,7);g.fill();rr(sk,270,920,120,140,40);
 g.fillStyle='#1c1c22';g.beginPath();g.ellipse(330,948,68,50,0,Math.PI,0);g.fill();F('#1c1c22',262,940,22,42);
 F('#2a1e18',300,972,30,6);F('#2a1e18',342,972,30,6);const bl=(t%2.7)<.12;g.fillStyle=dark?'#fff':'#2a1e18';

function scene3(t){const u=t-5.5,dark=t>8.1||(t>7.8&&Math.floor(t*20)%2==0);
 const wg=g.createLinearGradient(0,0,0,1350);wg.addColorStop(0,'#cbb88f');wg.addColorStop(.6,'#e6d6b0');wg.addColorStop(1,'#d9c79e');g.fillStyle=wg;g.fillRect(0,0,1080,1350);
 F('#121836',490,280,520,720);g.save();g.beginPath();g.rect(490,280,520,720);g.clip();stars(40,400);city(t,490,560,520/1080,914,8);g.restore();
 g.strokeStyle='#f4efe4';g.lineWidth=22;g.strokeRect(480,270,540,740);L(750,270,750,1000);F('#f4efe4',455,995,590,34);
 F('#5a3a28',380,212,700,18);F('#8e3d36',395,228,85,820);F('#8e3d36',1020,228,60,820);
 F('#6f5032',0,540,310,830);F('#8f6a43',0,560,285,810);g.strokeStyle='#7a5937';g.lineWidth=8;g.strokeRect(25,600,230,330);g.strokeRect(25,960,230,360);
 g.fillStyle='#ece0c8';g.font='600 52px Kanit';g.textAlign='center';g.fillText('2307',140,690);F('#cbb27e',230,930,38,28);g.fillStyle='#d9c08a';g.beginPath();g.arc(249,1000,18,0,7);g.fill();
 F('#7a5c3c',0,1350,1080,16);F('#8a6a4a',0,1366,1080,554);g.strokeStyle='#7a5b3d';g.lineWidth=4;for(let i=-6;i<=6;i++)L(540+i*70,1366,540+i*260,1920);
 if(!dark){const lg=g.createRadialGradient(590,1170,10,590,1170,300);lg.addColorStop(0,'rgba(255,230,150,.45)');lg.addColorStop(1,'rgba(255,230,150,0)');g.fillStyle=lg;g.fillRect(250,850,700,650)}
 g.fillStyle='#2a2a33';g.beginPath();g.ellipse(590,1460,40,10,0,0,7);g.fill();g.strokeStyle='#3a3a44';g.lineWidth=8;L(590,1460,590,1200);
 g.fillStyle=dark?'#8a8268':'#f2e2a0';g.beginPath();g.moveTo(545,1205);g.lineTo(635,1205);g.lineTo(612,1130);g.lineTo(568,1130);g.fill();
 F('#5b4030',700,1190,380,420);F('#4a3326',720,1210,360,170);F('#4a3326',720,1400,360,190);

document.fonts.load('800 80px Kanit');document.fonts.load('600 52px Kanit');// โหลดฟอนต์ก่อนวาด
window.render=t=>{g.setTransform(1,0,0,1,0,0);if(t<2.8)scene1(t);else if(t<5.5)scene2(t);else scene3(t);
 for(const b of [2.8,5.5]){const a=1-Math.abs(t-b)/.18;if(a>0)F('rgba(0,0,0,'+a+')',0,0,1080,1920)}};
let ready=document.fonts.ready.then(()=>render(0));const st=m=>document.getElementById('st').textContent=m;
document.getElementById('play').onclick=()=>{const s=performance.now();(function f(){const t=(performance.now()-s)/1000;render(Math.min(t,END));if(t<END)requestAnimationFrame(f)})()};
// บันทึกเป็น MP4 ในเครื่อง (WebCodecs) — ไม่ต้องมีเซิร์ฟเวอร์ ; เครื่องเก่าใช้ไม่ได้จะอัดแบบเรียลไทม์แทน
document.getElementById('rec').onclick=async()=>{await ready;try{
 if(!window.VideoEncoder)throw 'nowc';const cfg={codec:'avc1.640028',width:1080,height:1920,bitrate:6e6,framerate:FPS};if(!(await VideoEncoder.isConfigSupported(cfg)).supported)throw 'nowc';
 const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:1080,height:1920},fastStart:'in-memory'});
 const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>st('ผิดพลาด '+e)});enc.configure(cfg);
 for(let i=0;i<END*FPS;i++){render(i/FPS);const fr=new VideoFrame(cv,{timestamp:i*1e6/FPS,duration:1e6/FPS});enc.encode(fr,{keyFrame:i%60==0});fr.close();if(i%15==0){st('กำลังสร้าง '+Math.round(i/(END*FPS)*100)+'%');await new Promise(r=>setTimeout(r,0))}}
 await enc.flush();mux.finalize();done(new Blob([mux.target.buffer],{type:'video/mp4'}),'clip.mp4')
}catch(e){const ty=['video/mp4','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));st('เครื่องนี้ใช้โหมดอัดสด รอ '+END+' วินาที…');
 const r=new MediaRecorder(cv.captureStream(FPS),{mimeType:ty}),ch=[];r.ondataavailable=x=>ch.push(x.data);r.onstop=()=>done(new Blob(ch,{type:ty}),ty.includes('mp4')?'clip.mp4':'clip.webm');r.start();
 const s=performance.now();(function f(){const t=(performance.now()-s)/1000;render(Math.min(t,END));if(t<END)requestAnimationFrame(f);else r.stop()})()}};
function done(b,n){st('เสร็จแล้ว '+(b.size/1048576).toFixed(1)+' MB');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.className='dl';a.textContent='แตะเพื่อบันทึก '+n;document.body.appendChild(a);window.RESULT={n,size:b.size}}
</script></body></html>
